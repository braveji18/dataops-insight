# Trino coordinator — lakehouse-lab
# worker 1대를 별도 프로세스로 두고, coordinator 는 스케줄링만 담당한다
# (include-coordinator=false). StarRocks FE/BE 의 역할 분담과 대칭을 맞추기 위함.
coordinator=true
node-scheduler.include-coordinator=false
http-server.http.port=8080
discovery.uri=http://trino-coordinator:8080

query.max-memory=${ENV:TRINO_QUERY_MAX_MEMORY}
query.max-memory-per-node=${ENV:TRINO_QUERY_MAX_MEMORY_PER_NODE}

# 비교 공정성: 결과 캐시류 기본값 유지. 세션 단위로 끄고 켜는 것은 bench.sh 가 담당한다.
web-ui.enabled=true
