# StarRocks BE 오버라이드 — 이미지의 be.conf 뒤에 append 된다(뒤 값이 이긴다).
#
# BE 는 C++ 프로세스라 JVM 힙이 아니라 자체 mem_limit 으로 메모리를 통제한다.
# 그 값은 프로파일마다 달라야 해서 이 파일이 아니라 docker-compose.yml 의 기동 명령이
# SR_BE_MEM_LIMIT 을 append 한다. 여기에는 프로파일과 무관한 값만 둔다.

# ---- lakehouse-lab overrides ----
sys_log_level = INFO

# Data Cache: plan/01 B-3(캐시) 비교의 핵심 대상이라 기본값(활성)을 유지한다.
# 캐시를 배제한 측정이 필요하면 세션 변수로 끈다: SET enable_scan_datacache = false
datacache_enable = true
datacache_disk_size = 2G
