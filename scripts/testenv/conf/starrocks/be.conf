# StarRocks BE 오버라이드 — 이미지의 be.conf 뒤에 append 된다.
# BE 는 C++ 프로세스라 JVM 힙이 아니라 자체 mem_limit 으로 통제한다.
# 컨테이너 mem_limit(SR_BE_MEM)보다 반드시 작게 잡을 것 — 아니면 OOMKilled 로 조용히 죽는다.

# ---- lakehouse-lab overrides ----
sys_log_level = INFO

# Data Cache: plan/01 B-3(캐시) 비교의 핵심 대상이라 기본값(활성)을 유지한다.
# 캐시를 배제한 측정이 필요하면 세션 변수 SET enable_scan_datacache = false 로 끈다.
datacache_enable = true
datacache_disk_size = 2G
