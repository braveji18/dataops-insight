# StarRocks FE 오버라이드 — 이미지의 fe.conf 뒤에 append 된다(뒤 값이 이긴다).
# 통째로 교체하지 않는 이유: start_fe.sh 가 원본 fe.conf 의 LOG_DIR/JAVA_OPTS 등을
# 전제하고 있어서, 부분 오버라이드가 버전 업그레이드에 훨씬 안전하다.

# ---- lakehouse-lab overrides ----
run_mode = shared_nothing
sys_log_level = INFO

# 단일 BE 이므로 기본 복제본 수를 1로 낮춘다(내부 테이블 생성 시 필수).
default_replication_num = 1

# 외부 카탈로그 메타데이터 캐시. 비교 공정성을 위해 기본값을 유지하되,
# 캐시 영향을 배제해야 하는 측정에서는 bench.sh 가 세션 변수로 통제한다.
enable_background_refresh_connector_metadata = true
